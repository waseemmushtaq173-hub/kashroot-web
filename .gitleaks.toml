# Gitleaks config for KashRoot: the default rules, plus an allowlist for files that
# hold only public, non-secret fixtures. Real secrets live in .env / .env.local
# (gitignored) or in Vercel's environment variables, never in the repository.
title = "KashRoot gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Public demo fixtures: test specs, SQL tests, the skills folder and the env template"
paths = [
  '''(^|/)tests/.*\.spec\.ts$''',
  '''(^|/)supabase/tests/.*\.sql$''',
  '''(^|/)\.github/skills/gstack/''',
  '''(^|/)\.env\.example$''',
]
# data.gov.in's published sample keys (the real key is the DATA_GOV_IN_API_KEY setting).
regexes = [
  '''579b464db66ec23bdd000001(?:dbc75365931646465791ec2e46ef03a7|cdd3946e44ce4aad7209ff7b23ac571b)''',
]
