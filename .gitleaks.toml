# Gitleaks allowlist for KashRoot TrueScan repo.
# Public demo fixtures and historic commit fingerprints flagged by gitleaks --log-opts
# are intentionally present (tests, skills, docs) and must not fail CI.
# Real secrets live only in .env / .env.local (gitignored) or Vercel env vars.

[[rules]]
id = "public-jwt-fixture"
description = "Public demo JWT fragments used in skills/tests — not real secrets"
regex = '(eyJ[a-zA-Z0-9_-]{4,}\\.eyJ[a-zA-Z0-9_-]{4,}\\.[a-zA-Z0-9_-]{4,})'
paths:
  - '**.github/skills/gstack/**'
  - 'tests/*.spec.ts'
  - 'supabase/tests/*.sql'

[[rules]]
id = "data-gov-in-public-demo-key"
description = "Public data.gov.in demo/sample API keys (published by data.gov.in docs); real key is DATA_GOV_IN_API_KEY env var"
regex = '579b464db66ec23bdd000001(?:dbc75365931646465791ec2e46ef03a7|cdd3946e44ce4aad7209ff7b23ac571b)'
allowlist:
  - 'src/.env.example'
  - '.env.local'
  - '.env.*.local'
