title = "KashRoot Gitleaks Config"

# Start from gitleaks' built-in rules, then allowlist only the public demo
# fixtures this repo intentionally contains. Per-rule allowlists must be a
# single table ([rules.allowlist]) — a list of inline tables fails to load
# ("expected a map, got slice") and makes the whole scan error out.

[extend]
useDefault = true

[[rules]]
id = "public-jwt-fixture"
description = "Public demo JWT fragments used in skills/tests — not real secrets"
regex = '(eyJ[a-zA-Z0-9_-]{4,}\.eyJ[a-zA-Z0-9_-]{4,}\.[a-zA-Z0-9_-]{4,})'
  [rules.allowlist]
  description = "Public JWT fixtures only"
  paths = [
    '.*github/skills/gstack/.*',
    'tests/.*\.spec\.ts',
    'supabase/tests/.*\.sql',
  ]

[[rules]]
id = "data-gov-in-public-demo-key"
description = "Public data.gov.in demo/sample API keys — the real key is the DATA_GOV_IN_API_KEY env var"
regex = '579b464db66ec23bdd000001(?:dbc75365931646465791ec2e46ef03a7|cdd3946e44ce4aad7209ff7b23ac571b)'
  [rules.allowlist]
  description = "Public demo keys in examples and local env"
  paths = [
    '.*\.env\.example',
    '\.env\.local',
    '\.env\..*\.local',
  ]

# Global allowlist: public demo keys and test fixtures anywhere in the tree.
[allowlist]
description = "Allow public demo keys and test fixtures"
paths = [
  '\.env\.example',
  'src/lib/.*',
  'scripts/.*',
  'tests/.*',
  '\.claude/.*',
]
regexes = [
  '579b464db66ec23bdd000001dbc75365931646465791ec2e46ef03a7',
  'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+',
]
