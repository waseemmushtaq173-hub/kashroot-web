# One-off check: can GitHub's servers reach the government mandi APIs?
# (Vercel's servers are refused by api.data.gov.in.) Public sample key only.
name: mandi-probe
on:
  push:
    paths: ['.github/workflows/mandi-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: data.gov.in (Agmarknet daily prices, sample key)
        run: |
          curl -sS -m 40 -o body.json -w 'HTTP %{http_code} in %{time_total}s from %{remote_ip}\n' \
            'https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070?api-key=579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b&format=json&limit=3&filters%5Bstate.keyword%5D=Jammu%20and%20Kashmir' || echo "curl failed: $?"
          head -c 600 body.json || true; echo
      - name: data.gov.in CORS header (for browsers)
        run: |
          curl -sS -m 40 -D - -o /dev/null -H 'Origin: https://kashroot-web.vercel.app' \
            'https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070?api-key=579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b&format=json&limit=1' | grep -i -E '^HTTP|access-control' || echo "no CORS header / failed"
      - name: Agmarknet price report (expect captcha)
        run: |
          curl -sS -m 40 -w '\nHTTP %{http_code}\n' 'https://api.agmarknet.gov.in/v1/prices-and-arrivals/date-wise/specific-commodity?year=2026&month=10&stateId=14&commodityId=17&includeExcel=false' | head -c 400 || true
      - name: eNAM trade data
        run: |
          curl -sS -m 40 -o enam.txt -w 'HTTP %{http_code}\n' -X POST -d 'language=en&stateName=JAMMU+AND+KASHMIR&apmcName=-- Select APMCs --&commodityName=-- Select Commodity --&fromDate=2026-10-01&toDate=2026-10-11' 'https://enam.gov.in/web/Ajax_ctrl/trade_data_list' || echo "curl failed: $?"
          head -c 400 enam.txt || true; echo
