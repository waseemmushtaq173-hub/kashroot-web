# One-off check (removed again after reading the result): which public
# government mandi-price pages answer from a cloud server?
name: mandi-probe-2
on:
  push:
    paths: ['.github/workflows/mandi-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: eNAM trade data (browser-style, with session cookie)
        run: |
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/128 Mobile Safari/537.36'
          curl -sS -m 40 -A "$UA" -c jar.txt -o page.html -w 'page HTTP %{http_code}\n' 'https://enam.gov.in/web/dashboard/trade-data' || echo "page failed $?"
          grep -o 'name="[a-z_]*csrf[a-z_]*" value="[^"]*"' page.html | head -2 || true
          for D in "2026-10-09" "2026-10-10"; do
            curl -sS -m 40 -A "$UA" -b jar.txt -H 'X-Requested-With: XMLHttpRequest' -H 'Referer: https://enam.gov.in/web/dashboard/trade-data' \
              -o enam.txt -w "trade_data_list $D HTTP %{http_code} type %{content_type}\n" -X POST \
              --data-urlencode 'language=en' --data-urlencode 'stateName=JAMMU AND KASHMIR' --data-urlencode 'apmcName=-- Select APMCs --' \
              --data-urlencode 'commodityName=-- Select Commodity --' --data-urlencode "fromDate=$D" --data-urlencode "toDate=$D" \
              'https://enam.gov.in/web/Ajax_ctrl/trade_data_list' || echo "post failed $?"
            head -c 500 enam.txt; echo
          done
          curl -sS -m 40 -A "$UA" -b jar.txt -H 'X-Requested-With: XMLHttpRequest' -o st.txt -w 'states HTTP %{http_code}\n' -X POST --data 'language=en' 'https://enam.gov.in/web/Ajax_ctrl/states_name' || true
          head -c 300 st.txt; echo
      - name: Agmarknet legacy search page
        run: |
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/128 Mobile Safari/537.36'
          curl -sS -m 40 -A "$UA" -L -o ag.html -w 'HTTP %{http_code} final %{url_effective}\n' \
            'https://agmarknet.gov.in/SearchCmmMkt.aspx?Tx_Commodity=17&Tx_State=JK&Tx_District=0&Tx_Market=0&DateFrom=05-Oct-2026&DateTo=10-Oct-2026&Fr_Date=05-Oct-2026&To_Date=10-Oct-2026&Tx_Trend=0&Tx_CommodityHead=Apple&Tx_StateHead=Jammu+and+Kashmir&Tx_DistrictHead=--Select--&Tx_MarketHead=--Select--' || echo "failed $?"
          grep -o 'cphBody_GridPriceData[^>]*' ag.html | head -2 || true
          grep -o -i 'captcha' ag.html | head -1 || true
          head -c 300 ag.html; echo
      - name: Agmarknet 2.0 public dashboard APIs (no captcha?)
        run: |
          for u in 'https://api.agmarknet.gov.in/v1/dashboard/latest-prices?stateId=14' 'https://api.agmarknet.gov.in/v1/home/commodity-prices?stateId=14' 'https://api.agmarknet.gov.in/v1/daily-price-arrival/report?state=14&commodity=17'; do
            curl -sS -m 30 -o a.txt -w "$u HTTP %{http_code}\n" "$u" || true; head -c 250 a.txt; echo
          done
      - name: data.gov.in again (sample key)
        run: |
          curl -sS -m 40 -o body.json -w 'HTTP %{http_code} from %{remote_ip}\n' \
            'https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070?api-key=579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b&format=json&limit=3&filters%5Bstate.keyword%5D=Jammu%20and%20Kashmir' || echo "curl failed: $?"
          head -c 400 body.json || true; echo
