name: Sync Government Agro Registry

# Switched off: the route answers 410 and the official-list tables are filled only from the publishers' own files
# (Admin -> Official lists). Kept only so the old runs stay readable; it no longer runs on a schedule.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Vercel cron sync
        run: |
          curl -s -X GET "${{ secrets.VERCEL_CRON_URL || '' }}/api/cron/sync-gov-registry" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail-with-body || echo "cron sync skipped (no VERCEL_CRON_URL)"
