name: Sync Government Agro Registry

on:
  schedule:
    - cron: '0 4 * * *'  # daily 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Vercel cron sync
        run: |
          curl -s -X GET "${{ secrets.VERCEL_CRON_URL || '' }}/api/cron/sync-gov-registry" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail-with-body || echo "cron sync skipped (no VERCEL_CRON_URL)"
