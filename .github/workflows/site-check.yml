# One-off check (removed again after reading the result): the new village
# search against the real map services, and the live mandi answers in short.
name: site-check
on:
  push:
    paths: ['.github/workflows/site-check.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Village search (this branch's code, real map services)
        run: |
          sed "/^import 'server-only';/d" src/lib/server/places.ts > /tmp/places.ts
          cat > /tmp/t.mts <<'EOF'
          const { geocode } = await import('/tmp/places.ts');
          for (const q of ['Chitragam Kalan', 'Chitragam Kalan Shopian', 'Chitragam, Shopian', 'Chitragam', 'Pinjoora Shopian', 'Zainapora', 'Hirpora Shopian', 'Keller Shopian', 'Sopore', 'Kangra', 'Nashik', 'Wachi']) {
            for (const deep of [false, true]) {
              const t = Date.now();
              try {
                const r = await geocode(q, { deep });
                console.log(`${q} [deep=${deep}] ${Date.now() - t}ms →`, r.slice(0, 3).map((p) => `${p.name} | ${p.admin}${p.note ? ' | NOTE: ' + p.note : ''}`).join('  ||  ') || '(nothing)');
              } catch (e) { console.log(`${q} [deep=${deep}] ERROR ${e.message}`); }
              await new Promise((r) => setTimeout(r, 1200));
            }
          }
          EOF
          node --experimental-strip-types --no-warnings /tmp/t.mts
      - name: Live mandi answers in short
        run: |
          B=https://kashroot-web.vercel.app
          for Q in "state=Jammu%20and%20Kashmir&commodity=Apple" "state=Jammu%20and%20Kashmir&district=Shopian&commodity=Apple" "state=Jammu%20and%20Kashmir&district=Baramulla&commodity=Apple" "state=Jammu%20and%20Kashmir&market=Sopore&commodity=Apple" "state=Himachal%20Pradesh&district=Shimla&commodity=Apple" "state=Punjab&commodity=Wheat" "state=Punjab&commodity=Paddy(Dhan)(Common)" "commodity=Apple"; do
            echo "=== $Q"
            curl -sS -m 60 "$B/api/mandi?$Q&limit=2000" | python3 -c '
          import json,sys,collections
          d=json.load(sys.stdin); r=d.get("records",[])
          print("rows",len(r),"| widened:",d.get("widened"),"| source:",d.get("source"),"| error:",d.get("error"))
          print("dates",sorted(collections.Counter(x["arrivalDate"] for x in r).items())[-3:])
          print("districts",collections.Counter(x["district"] for x in r).most_common(8))
          print("first",[(x["market"],x["variety"],x["modalPrice"]) for x in r[:3]])'
          done
