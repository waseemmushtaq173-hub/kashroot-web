# One-off check (removed again after reading the result): the new place search
# (src/lib/server/places.ts) against the live map services.
name: data-probe
on:
  push:
    paths: ['.github/workflows/data-probe.yml', 'src/lib/server/places.ts']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Place search
        run: |
          mkdir -p t && grep -v "^import 'server-only'" src/lib/server/places.ts > t/places.ts
          cat > t/run.ts <<'TS'
          import { geocode, placeName } from './places.ts';
          const qs = ['chitragam kalan shopian', 'chitragam', 'zainapora', 'tral', 'keller shopian', 'srinagar', 'pinjoora shopian', 'wachi'];
          for (const q of qs) {
            for (const deep of [false, true]) {
              const r = await geocode(q, { deep });
              console.log(`${deep ? 'FIND ' : 'TYPE '}${q} →`, r.length ? r.slice(0, 3).map((p) => `${p.name} | ${p.admin} | ${p.lat.toFixed(3)},${p.lng.toFixed(3)}${p.note ? ' | NOTE ' + p.note : ''}`).join('  ;;  ') : 'NOTHING');
              await new Promise((ok) => setTimeout(ok, 1100));
            }
          }
          console.log('reverse', await placeName(33.71, 74.83));
          console.log('reverse', await placeName(34.0837, 74.7973));
          TS
          node --experimental-strip-types t/run.ts
