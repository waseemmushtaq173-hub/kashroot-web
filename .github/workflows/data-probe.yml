# One-off check (removed again after reading the result): which official
# Government sources for fertilisers and pesticides can be read automatically.
name: data-probe
on:
  push:
    paths: ['.github/workflows/data-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: data.gov.in catalogue
        run: |
          K=579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b
          for Q in pesticide insecticide "banned pesticide" fertiliser fertilizer "fertilizer company" "fertiliser manufacturer" CIBRC; do
            E=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))' "$Q")
            echo "=== lists q=$Q"
            curl -sS -m 30 "https://api.data.gov.in/lists?format=json&offset=0&limit=15&q=$E" | python3 -c '
          import json,sys
          try:
            d=json.load(sys.stdin)
          except Exception as e:
            print("not json", e); sys.exit()
          print("keys", list(d.keys())[:10], "total", d.get("total"), d.get("count"))
          for r in (d.get("records") or [])[:15]:
            print("-", r.get("index_name") or r.get("id"), "|", (r.get("title") or "")[:110], "|", r.get("updated_date") or r.get("updated"), "|", r.get("org") or r.get("source"))' || true
          done
      - name: ppqs / CIB&RC pages
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          for U in https://ppqs.gov.in/divisions/cib-rc https://ppqs.gov.in/divisions/cib-rc/registered-products https://ppqs.gov.in/divisions/cib-rc/major-uses-of-pesticides https://ppqs.gov.in/en/divisions/cib-rc https://cibrc.nic.in https://cibrcseed.gov.in https://pesticides.gov.in; do
            echo "=== $U"
            curl -sS -L -m 30 -A "$UA" -o /tmp/p.html -w "HTTP %{http_code} %{url_effective} %{size_download}B\n" "$U" || true
            grep -oiE 'href="[^"]+\.(pdf|xlsx?|csv)"' /tmp/p.html 2>/dev/null | head -25 || true
            grep -oiE '<title>[^<]*' /tmp/p.html | head -1 || true
          done
      - name: Fertiliser department sources
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          for U in https://www.fert.nic.in https://fert.gov.in https://www.urvarak.nic.in https://urvarak.nic.in/public_reports https://agriwelfare.gov.in/en/FertilizerControl https://agriwelfare.gov.in/en/Fertilizer; do
            echo "=== $U"
            curl -sS -L -m 30 -A "$UA" -o /tmp/p.html -w "HTTP %{http_code} %{url_effective} %{size_download}B\n" "$U" || true
            grep -oiE 'href="[^"]*(fco|control-order|schedule|companies|manufactur|registration|pdf)[^"]*"' /tmp/p.html 2>/dev/null | sort -u | head -25 || true
          done
